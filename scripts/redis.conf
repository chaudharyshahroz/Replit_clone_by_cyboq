# Minimal Redis configuration for local Reklu development.
#
# Why this file exists: Homebrew's Redis 8 config ships `loadmodule` directives
# for RedisBloom / RediSearch / RedisJSON / RedisTimeSeries using relative paths
# that are not present in the bottle. Redis aborts on startup as a result. Reklu
# needs none of those modules, so rather than editing your global
# /opt/homebrew/etc/redis.conf, we start Redis with this config instead.
#
#   pnpm redis          # foreground
#   pnpm redis:stop
#
# Your system Redis configuration is left untouched.

port 6379
bind 127.0.0.1 -::1
protected-mode yes

daemonize no
loglevel notice

# Persistence is unnecessary for a dev queue: BullMQ is transport, and the
# durable record lives in Postgres (docs/DECISIONS.md D9). Keeping this off
# avoids fsync stalls during development.
save ""
appendonly no

# Bound memory so a runaway local job cannot consume the machine.
maxmemory 256mb
maxmemory-policy noeviction
